<!DOCTYPE html><html lang="ar" dir="rtl" data-t="d"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache"><title>منيو واحة العمدة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Rakkas&display=swap" rel="stylesheet">
<style>
:root{--bg:#1E1410;--tx:#F5DABF;--ac:#6C151E;--cd:#2d201a;--bd:#F5DABF55;--g2:#e07a8a}
[data-t=l]{--bg:#F5DABF;--tx:#2b1810;--cd:#fff6ea;--bd:#6C151E55;--g2:#6C151E}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font-family:Cairo,sans-serif;max-width:640px;margin:auto;padding:env(safe-area-inset-top) 0 90px;transition:background .3s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#sp{position:fixed;inset:0;background:var(--bg);z-index:99;display:grid;place-content:center;justify-items:center;gap:12px;transition:.8s}#sp.x{opacity:0;transform:scale(1.5);filter:blur(14px);pointer-events:none}
#sp img{width:min(92vw,560px);border-radius:16px;animation:fl 2s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-10px) scale(1.05)}}
header{text-align:center;padding:0 0 6px;position:relative;overflow:hidden}
.cv{display:block;width:100%;height:auto;animation:zi 1.2s ease-out}@keyframes zi{from{opacity:0;transform:scale(1.06)}}
h1{font-family:Rakkas;font-size:44px;font-weight:400;margin-top:10px;background:linear-gradient(90deg,var(--tx),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{opacity:.85}.dv{display:flex;align-items:center;gap:12px;margin:16px 22px 10px}.dv:before,.dv:after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--g2))}.dv:after{transform:scaleX(-1)}.dv i{width:11px;height:11px;transform:rotate(45deg);background:var(--g2);box-shadow:0 0 0 4px var(--bg),0 0 0 5px var(--g2)}.pt{position:absolute;bottom:0;width:6px;height:6px;border-radius:50%;background:var(--tx);opacity:.5;animation:up 6s linear infinite}@keyframes up{to{transform:translateY(-220px);opacity:0}}
#tb{display:inline-block;margin-top:8px;background:var(--ac);color:#F5DABF;padding:2px 14px;border-radius:14px}
#th{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:60;background:var(--ac);color:#F5DABF;border:0;border-radius:50%;width:38px;height:38px;font-size:18px}
#sl{position:relative;aspect-ratio:1;overflow:hidden;margin:12px;border-radius:18px;touch-action:pan-y}.tr{display:flex;height:100%;transition:transform .6s}.sd{min-width:100%;position:relative}.sd img{width:100%;height:100%;object-fit:cover}
.sd span{position:absolute;bottom:16px;right:14px;background:#000a;color:#fff;padding:4px 14px;border-radius:12px}#pb{position:absolute;bottom:0;right:0;height:4px;width:100%;background:#e07a8a;transform-origin:right;animation:pg 4.5s linear}@keyframes pg{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#nav{position:sticky;top:0;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 12px;z-index:5}#nav a{white-space:nowrap;padding:6px 14px;border:1px solid var(--bd);border-radius:20px;color:var(--tx);text-decoration:none}#nav a.on{background:var(--ac);color:#F5DABF;border-color:var(--ac)}
section{padding:0 12px;scroll-margin-top:60px}h2{font-family:Rakkas;font-weight:400;font-size:26px;margin:18px 0 8px}h3{font-family:Rakkas;font-weight:400;margin:8px 0}
.cd{display:flex;gap:10px;align-items:center;background:var(--cd);border-radius:14px;padding:10px;margin-bottom:10px;cursor:pointer;opacity:0;transform:translateY(16px);transition:.5s}.cd.sh{opacity:1;transform:none}.cd.out{opacity:.5!important}
.cd img,.ic{width:88px;height:88px;border-radius:12px;object-fit:cover;flex:none}.ic{display:grid;place-items:center;font-size:44px;background:var(--bg)}
.in{flex:1}.in p{font-size:13px;opacity:.8}.pr{border:2px solid var(--tx);border-radius:10px;padding:4px 10px;font-weight:700;white-space:nowrap}
.ad{background:var(--ac);color:#F5DABF;border:0;border-radius:10px;padding:5px 14px;font:inherit;margin-top:4px}
em{font-style:normal;background:var(--g2);color:#fff;border-radius:8px;padding:0 8px;font-size:12px;margin-right:6px}
#ov{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:flex-end}#sh{background:var(--bg);width:100%;max-width:640px;margin:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.g label{display:block;padding:6px 0}.q{display:flex;gap:14px;align-items:center;justify-content:center;margin:12px 0}.q button{width:36px;height:36px;border-radius:50%;border:1px solid var(--tx);background:none;color:var(--tx);font-size:20px}
.ln{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}.ln .q{margin:0}
#cb{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:auto;background:var(--ac);color:#F5DABF;text-align:center;padding:14px 14px calc(14px + env(safe-area-inset-bottom));font-weight:700;z-index:40;cursor:pointer}
footer{text-align:center;padding:22px;font-size:13px;opacity:.85}
</style></head><body>
<div id="sp"><img src="cover.jpg" alt=""></div>
<button id="th" onclick="TH()" aria-label="تبديل الوضع">☀️</button>
<header><img class="cv" src="cover.jpg" alt="واحة العمدة"><div class="dv"><i></i></div><p>اختار من الأصناف واطلب بسهولة</p><div id="tb" hidden></div></header>
<div id="sl" hidden></div><nav id="nav"></nav><main id="list"></main>
<footer>العملة: جنيه مصري • اسأل الكاشير عن الإضافات<br><span id="cr"></span></footer>
<div id="cb" hidden onclick="CS()"></div><div id="ov" hidden onclick="if(event.target==this)CL()"><div id="sh"></div></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script><script src="config.js"></script>
<script>
let M=DEF,IM={},cart=[],db,ts=0,cur,si=0,st,x0=0;
const $=s=>document.querySelector(s),E=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={waffle:'🧇',tea:'🍵',mug:'☕',ice:'🧊',shake:'🥤',juice:'🧃'},TD=new Date().toISOString().slice(0,10);
const PR=it=>it.o&&it.o[0]&&it.o[1]>=TD?it.o[0]:it.p,F=id=>{for(const c of M.c)for(const it of c.it)if(it.id==id)return it};
const tq=new URLSearchParams(location.search).get('t');if(tq)sessionStorage.tb=tq;const TB=sessionStorage.tb;
function TH(){const d=document.documentElement,l=d.dataset.t=='d'?'l':'d';d.dataset.t=l;$('#th').textContent=l=='d'?'☀️':'🌙';try{localStorage.th=l}catch(e){}}
try{if(localStorage.th=='l')TH()}catch(e){}
$('#cr').textContent=CREDIT;if(TB){$('#tb').hidden=false;$('#tb').textContent='🪑 '+(M.w.l||'طاولة')+' '+TB}
for(let i=0;i<14;i++){const p=document.createElement('i');p.className='pt';p.style.cssText=`left:${i*7+3}%;animation-delay:${i*.45}s`;$('header').append(p)}
setTimeout(()=>$('#sp').classList.add('x'),2000);
const cd=it=>{const im=IM[it.i]?`<img src="${IM[it.i]}" alt="">`:`<div class=ic>${IC[it.t]||'🍽️'}</div>`,hz=it.z&&it.z.length,p=hz?'من '+Math.min(...it.z.map(z=>z[1])):PR(it),old=!hz&&PR(it)!=it.p?`<s>${it.p}</s> `:'';
return `<div class="cd ${it.f=='out'?'out':''}" onclick="OP('${it.id}')">${im}<div class=in><b>${E(it.n)}</b>${it.f=='new'?'<em>جديد</em>':''}${it.f=='out'?'<em>نفد</em>':''}<p>${E(it.d)}</p><button class=ad>أضف للطلب</button></div><div class=pr>${old}${p} ج.م</div></div>`};
function R(){SL();$('#nav').innerHTML=M.c.map((c,i)=>`<a href="#c${i}">${E(c.n)}</a>`).join('');
$('#list').innerHTML=M.c.map((c,i)=>`<section id=c${i}><h2>${E(c.n)}</h2>${c.it.map(cd).join('')}</section>`).join('');
const o=new IntersectionObserver(a=>a.forEach(e=>{if(e.isIntersecting){e.target.classList.add('sh');o.unobserve(e.target)}}));document.querySelectorAll('.cd').forEach(e=>o.observe(e));onscroll()}
onscroll=()=>{let a=0;M.c.forEach((_,i)=>{const e=$('#c'+i);if(e&&e.getBoundingClientRect().top<120)a=i});document.querySelectorAll('#nav a').forEach((l,i)=>{l.classList.toggle('on',i==a);if(i==a)l.scrollIntoView({inline:'center',block:'nearest'})})};
function SL(){const s=M.s||[],b=$('#sl');clearTimeout(st);if(!s.length){b.hidden=true;return}b.hidden=false;
b.innerHTML='<div class=tr>'+s.map(x=>`<div class=sd><img src="${IM[x[0]]||''}" alt=""><span>${E(x[1])}</span></div>`).join('')+'</div><i id=pb></i>';
b.ontouchstart=e=>x0=e.touches[0].clientX;b.ontouchend=e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>40)go(si+(d>0?-1:1))};go(0)}
function go(i){const n=(M.s||[]).length;si=(i+n)%n;$('.tr').style.transform=`translateX(${si*100}%)`;const p=$('#pb');p.style.animation='none';p.offsetWidth;p.style.animation='';clearTimeout(st);st=setTimeout(()=>go(si+1),4500)}
const U=c=>(c.z>=0?c.it.z[c.z][1]:PR(c.it))+c.a.reduce((s,i)=>s+c.it.a[i][1],0);
function OP(id){const it=F(id);if(!it||it.f=='out')return;cur={it,q:1,z:it.z&&it.z.length?0:-1,a:[]};MD()}
function MD(){const{it,q,z,a}=cur;let h=`<h3>${E(it.n)}</h3>`;
if(z>=0)h+='<div class=g>'+it.z.map((x,i)=>`<label><input type=radio name=z ${i==z?'checked':''} onchange="cur.z=${i};MD()"> ${E(x[0])} — ${x[1]} ج.م</label>`).join('')+'</div>';
if(it.a&&it.a.length)h+='<h3>إضافات</h3><div class=g>'+it.a.map((x,i)=>`<label><input type=checkbox ${a.includes(i)?'checked':''} onchange="TA(${i})"> ${E(x[0])} +${x[1]} ج.م</label>`).join('')+'</div>';
h+=`<div class=q><button onclick="cur.q=Math.max(1,cur.q-1);MD()">−</button><b>${q}</b><button onclick="cur.q++;MD()">+</button></div><button class=ad style="width:100%;padding:12px" onclick="AD()">أضف للطلب — ${U(cur)*q} ج.م</button>`;$('#sh').innerHTML=h;$('#ov').hidden=false}
function TA(i){const k=cur.a.indexOf(i);k<0?cur.a.push(i):cur.a.splice(k,1);MD()}
function AD(){const{it,q,z,a}=cur;cart.push({id:it.id,n:it.n,z:z>=0?it.z[z][0]:'',a:a.map(i=>it.a[i][0]),u:U(cur),q});CL();CB()}
const CL=()=>$('#ov').hidden=true,tot=()=>cart.reduce((s,x)=>s+x.u*x.q,0);
function CB(){const n=cart.reduce((s,x)=>s+x.q,0);$('#cb').hidden=!n;$('#cb').textContent=`أكمل طلبك (${n}) · ${tot()} ج.م`}
function CS(){$('#sh').innerHTML='<h3>طلبك</h3>'+cart.map((x,i)=>`<div class=ln><span>${E(x.n)} ${E(x.z)} ${E(x.a.join('، '))}</span><span class=q><button onclick="CQ(${i},-1)">−</button><b>${x.q}</b><button onclick="CQ(${i},1)">+</button></span><span>${x.u*x.q}</span></div>`).join('')+`<h3>الإجمالي: ${tot()} ج.م</h3><button class=ad style="width:100%;padding:12px" onclick="SD()">إرسال الطلب على واتساب</button>`;$('#ov').hidden=false}
function CQ(i,d){cart[i].q+=d;if(cart[i].q<1)cart.splice(i,1);CB();cart.length?CS():CL()}
function SD(){const w=M.w;let m=w.p+'\n';cart.forEach(x=>{m+=`• ${x.q}× ${x.n}${x.z?' ('+x.z+')':''}${x.a.length?' + '+x.a.join('، '):''} = ${x.u*x.q} ج.م\n`});m+=`الإجمالي: ${tot()} ج.م\n`;if(TB)m+=`${w.l||'طاولة'}: ${TB}\n`;m+=w.s;
if(db)cart.forEach(x=>db.ref('data/stats/'+x.id).transaction(v=>(v||0)+x.q));open('https://wa.me/'+w.n+'?text='+encodeURIComponent(m))}
async function LD(f){try{if(!FB.databaseURL)return;if(!db){firebase.initializeApp(FB);db=firebase.database()}
const t=(await db.ref('data/menu/ts').once('value')).val();if(!f&&t==ts)return;const v=(await db.ref('data/menu').once('value')).val();
if(v&&v.json){M=JSON.parse(v.json);IM=v.img||{};ts=t;try{localStorage.wm=JSON.stringify({M,IM,ts})}catch(e){}R()}}catch(e){}}
try{const c=JSON.parse(localStorage.wm);M=c.M;IM=c.IM;ts=c.ts}catch(e){}
R();LD(1);setInterval(LD,45000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)LD()});
</script></body></html>
